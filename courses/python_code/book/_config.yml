# Book settings
title: AI Agents in Python
author: Alberto Ezpondaburu
copyright: ""
logo: ""

# Execution settings — students run notebooks locally or in Colab; builds do not need API keys.
execute:
  execute_notebooks: "off"

# Parse settings
parse:
  myst_enable_extensions:
    - colon_fence
    - deflist

# HTML settings
html:
  use_issues_button: false
  use_repository_button: true
  use_edit_page_button: false
  extra_footer: |
    <div style="margin-top: 10px;">
      By Alberto Ezpondaburu
      <a href="https://www.linkedin.com/in/alberto-ezpondaburu-merino-305394ab/" target="_blank" style="margin-left: 10px; color: inherit;"><i class="fab fa-linkedin fa-lg"></i></a>
      <a href="https://github.com/ezponda" target="_blank" style="margin-left: 8px; color: inherit;"><i class="fab fa-github fa-lg"></i></a>
    </div>
    <script data-goatcounter="https://ai-agents-course.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

# Repository settings
repository:
  url: https://github.com/ezponda/ai-agents-course
  branch: main
  path_to_book: courses/python_code/book

# The standard launch menu keeps Colab available as the zero-setup fallback.
launch_buttons:
  notebook_interface: "classic"
  colab_url: "https://colab.research.google.com"
