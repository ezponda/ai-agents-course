name: Python local environment

on:
  push:
    paths:
      - "courses/python_code/requirements-local.txt"
      - ".github/workflows/python-local-smoke.yml"
  pull_request:
    paths:
      - "courses/python_code/requirements-local.txt"
      - ".github/workflows/python-local-smoke.yml"
  workflow_dispatch:

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local notebook interface
        run: python -m pip install -r courses/python_code/requirements-local.txt
      - name: Verify versions and extension
        run: |
          python -c "from importlib.metadata import version; assert version('jupyterlab') == '4.5.7'; assert version('jupyterlab-myst') == '2.7.0'"
          python -m jupyter labextension list
